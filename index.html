<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>NS Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; }
        #history-list { overflow-y: auto; }
        #chat-window { overflow-y: auto; }
        .chat-bubble {
            max-width: 75%;
            padding: 0.5rem 0.9rem;
            border-radius: 1rem;
            margin-bottom: 0.5rem;
        }
        .chat-bubble.user {
            align-self: flex-end;
            background-color: #0d6efd;
            color: #fff;
        }
        .chat-bubble.assistant {
            align-self: flex-start;
            background-color: #d1e7dd;
            color: #0f5132;
            border: 1px solid #a3cfbb;
        }
        .chat-bubble.error {
            align-self: flex-start;
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }
        .list-group-item.active-chat {
            background-color: #0d6efd;
            color: #fff;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid vh-100 py-3">
        <div class="row h-100">
            <!-- Chat history sidebar -->
            <div class="col-3 d-flex flex-column h-100 border-end">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Chats</h5>
                    <button id="new-chat-btn" class="btn btn-sm btn-primary">New Chat</button>
                </div>
                <div id="history-list" class="list-group flex-grow-1"></div>
            </div>

            <!-- Main chat interface -->
            <div class="col-9 d-flex flex-column h-100">
                <div id="chat-window" class="flex-grow-1 bg-white rounded border p-3 mb-3 d-flex flex-column">
                </div>
                <div class="input-group">
                    <textarea id="input" class="form-control" rows="2" placeholder="Type a message..."></textarea>
                    <button id="send-btn" class="btn btn-primary">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById("chat-window");
        const historyList = document.getElementById("history-list");
        const input = document.getElementById("input");

        let currentChatId = null;

        async function loadChats() {
            const res = await fetch("/chats");
            const chats = await res.json();

            historyList.innerHTML = chats
                .map(c => `
                    <a href="#" data-id="${c.id}"
                       class="list-group-item list-group-item-action text-truncate ${c.id === currentChatId ? "active-chat" : ""}">
                        ${c.title}
                    </a>
                `)
                .join("");

            historyList.querySelectorAll("a").forEach(a => {
                a.addEventListener("click", (e) => {
                    e.preventDefault();
                    switchChat(Number(a.dataset.id));
                });
            });

            return chats;
        }

        async function switchChat(chatId) {
            currentChatId = chatId;
            await loadChats();
            await loadMessages();
        }

        async function createChat() {
            const res = await fetch("/chats", { method: "POST" });
            const chat = await res.json();
            await switchChat(chat.id);
        }

        async function loadMessages() {
            if (currentChatId === null) {
                chatWindow.innerHTML = "";
                return;
            }
            const res = await fetch(`/chats/${currentChatId}/messages`);
            const msgs = await res.json();

            chatWindow.innerHTML = msgs
                .map(m => `<div class="chat-bubble ${m.role}">${m.text}</div>`)
                .join("");
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            if (currentChatId === null) {
                const res = await fetch("/chats", { method: "POST" });
                const chat = await res.json();
                currentChatId = chat.id;
            }

            await fetch(`/chats/${currentChatId}/messages`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: text })
            });
            input.value = "";
            await loadChats();
            await loadMessages();
        }

        document.getElementById("send-btn").addEventListener("click", sendMessage);
        document.getElementById("new-chat-btn").addEventListener("click", createChat);
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        loadChats();
    </script>
</body>
</html>
