services:
  ollama:
    image: ollama/ollama:latest
    environment:
      # Optional -- leave unset (the default) to run fully offline against
      # the local qwen2.5:7b model, no signup or key needed. Set this in a
      # local `.env` file (see .env.example) to authenticate this daemon
      # against Ollama Cloud non-interactively instead of `ollama signin`,
      # which can't run inside a headless container.
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: pulls the models the app needs, then exits. `app` waits on it.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull embeddinggemma && ollama pull qwen2.5:7b"]
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Defaults to the local qwen2.5:7b fallback -- zero-config, no
      # signup/API key needed. To opt into Ollama Cloud instead, set
      # OLLAMA_API_KEY, OLLAMA_MODEL=gpt-oss:120b-cloud (the default model
      # in faq_chatbot.hocon), and OLLAMA_BASE_URL=https://ollama.com in a
      # local `.env` file -- see .env.example and the comments in
      # backend/agent_network/faq_llm_info.hocon.
      #
      # OLLAMA_BASE_URL has to go straight to Ollama Cloud (not the
      # `ollama` container below) for the cloud model to work: the local
      # daemon only proxies cloud models for a daemon that's done an
      # interactive `ollama signin`, which OLLAMA_API_KEY alone doesn't
      # satisfy -- it'll 401. Calling https://ollama.com directly with
      # OLLAMA_API_KEY as a Bearer token (read automatically by the
      # `ollama`/`langchain-ollama` clients neuro-san uses) is the path
      # that's actually been verified to work.
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      # Embeddings always stay on the local daemon -- embeddinggemma isn't
      # a cloud model, so this one is never meant to point at Ollama Cloud.
      - OLLAMA_EMBED_HOST=http://ollama:11434
    volumes:
      # Bind-mount so the embedding cache survives container recreation
      # instead of being rebuilt (needs a live Ollama call) every restart.
      - ./data:/app/data
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_data:
