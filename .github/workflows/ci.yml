name: CI/CD

on:
  push:
    branches: [main, faqChatBot]
  pull_request:
    branches: [main]

env:
  IMAGE_REPO: ns-chatbot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: dockerfile_check
        run: |
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: steps.dockerfile_check.outputs.present == 'true'
        run: |
          docker build \
            -t ${{ env.IMAGE_REPO }}:${{ github.sha }} \
            -t ${{ env.IMAGE_REPO }}:latest \
            .

      - name: Check DockerHub secrets are configured
        if: steps.dockerfile_check.outputs.present == 'true'
        id: secrets_check
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to DockerHub
        if: steps.dockerfile_check.outputs.present == 'true' && steps.secrets_check.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        if: steps.dockerfile_check.outputs.present == 'true' && steps.secrets_check.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag ${{ env.IMAGE_REPO }}:${{ github.sha }} "$DH_USER/${{ env.IMAGE_REPO }}:${{ github.sha }}"
          docker tag ${{ env.IMAGE_REPO }}:latest "$DH_USER/${{ env.IMAGE_REPO }}:latest"
          docker push "$DH_USER/${{ env.IMAGE_REPO }}" --all-tags

      - name: Skip (no Dockerfile yet)
        if: steps.dockerfile_check.outputs.present != 'true'
        run: echo "No Dockerfile in the repo yet — skipped build/push."

      - name: Skip push (DockerHub secrets not configured)
        if: steps.dockerfile_check.outputs.present == 'true' && steps.secrets_check.outputs.configured != 'true'
        run: echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — built the image but skipped pushing."

      - name: Skip push (not main)
        if: steps.dockerfile_check.outputs.present == 'true' && steps.secrets_check.outputs.configured == 'true' && github.ref != 'refs/heads/main'
        run: echo "Not on main — built the image to validate it, but skipped pushing to DockerHub."
