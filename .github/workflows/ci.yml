name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE_REPO: ns-chatbot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest test_main.py -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_REPO }}:${{ github.sha }} \
            -t ${{ env.IMAGE_REPO }}:latest \
            .

      - name: Check DockerHub secrets are configured
        id: secrets_check
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to DockerHub
        if: steps.secrets_check.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        if: steps.secrets_check.outputs.configured == 'true'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag ${{ env.IMAGE_REPO }}:${{ github.sha }} "$DH_USER/${{ env.IMAGE_REPO }}:${{ github.sha }}"
          docker tag ${{ env.IMAGE_REPO }}:latest "$DH_USER/${{ env.IMAGE_REPO }}:latest"
          docker push "$DH_USER/${{ env.IMAGE_REPO }}" --all-tags

      - name: Skip push (DockerHub secrets not configured)
        if: steps.secrets_check.outputs.configured != 'true'
        run: echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — built the image but skipped pushing."
